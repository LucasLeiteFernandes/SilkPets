<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SilkPets</title>
		<link rel="stylesheet" href="Style.css" />
	</head>
	<body>
		<header class="topbar">
			<div class="shell topbar__inner">
				<a class="brand" href="#">
					<span class="brand__text">SilkPets</span>
					<img class="petIcon" src="./Imagens/petIcon.png" alt="">
				</a>

				<label class="search" aria-label="Pesquisar">
					<span class="search__icon" aria-hidden="true">
						<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2" />
							<path d="M16.2 16.2 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
						</svg>
					</span>
					<input class="search__input" type="search" placeholder="Pesquisar..." />
				</label>

				<div class="actions">
					<button class="btn btn--meus" id="btnMeusPets" type="button">
						<span class="btn__icons" aria-hidden="true">🐾</span>
						<span class="btn__label">CADASTRAR PET</span>
					</button>
					<button class="btn btn--login" id="btnLogin" type="button">LOGIN</button>
					<a class="avatar" href="#" aria-label="Perfil" id="btnPerfil">
						<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path d="M12 12a4.2 4.2 0 1 0-4.2-4.2A4.2 4.2 0 0 0 12 12Z" fill="currentColor" />
							<path d="M4.5 20.2c1.9-4.3 13.1-4.3 15 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
						</svg>
					</a>
				</div>
			</div>
		</header>

		<nav class="tabs">
			<div class="shell tabs__inner" role="tablist" aria-label="Seções">
				<a class="tab" href="../consultas/consultas.html" role="tab">CONSULTAS</a>
				<a class="tab" href="../vacinas/vacinas.html" role="tab">VACINAS</a>
				<a class="tab" href="../servicos/servicos.html" role="tab">SERVIÇOS</a>
			</div>
		</nav>

		<main class="page">
			<div class="shell">
				<section class="page-header" aria-label="Resumo da pagina inicial">
					<div>
						<h1 class="page-title">Pets cadastrados</h1>
						<p class="page-subtitle" id="sessionBadge">Faça login para cadastrar seu usuario e seu pet.</p>
					</div>
				</section>

				<section class="cards" aria-label="Pets cadastrados">
				</section>
			</div>
		</main>

		<!-- Modal de Login -->
		<div class="modal" id="modalLogin">
			<div class="modal__content">
				<button class="modal__close" id="closeLogin">&times;</button>
				<h2 class="modal__title">Login</h2>
				<form class="modal__form" id="formLogin">
					<p class="form__message" id="loginMessage" aria-live="polite"></p>
					<div class="form__group">
						<label for="loginEmail">Email:</label>
						<input type="email" id="loginEmail" name="email" required placeholder="seu@email.com" />
					</div>
					<div class="form__group">
						<label for="loginPassword">Senha:</label>
						<input type="password" id="loginPassword" name="password" required placeholder="Sua senha" />
					</div>
					<button type="submit" class="btn btn--primary">Entrar</button>
				</form>
				<p class="modal__footer">
					Não tem conta? 
					<button class="link-btn" id="switchToCadastro">Cadastre-se aqui</button>
				</p>
			</div>
		</div>

		<!-- Modal de Cadastro -->
		<div class="modal" id="modalCadastro">
			<div class="modal__content">
				<button class="modal__close" id="closeCadastro">&times;</button>
				<h2 class="modal__title">Cadastro</h2>
				<form class="modal__form" id="formCadastro">
					<p class="form__message" id="cadastroMessage" aria-live="polite"></p>
					<div class="form__group">
						<label for="cadastroNome">Nome Completo:</label>
						<input type="text" id="cadastroNome" name="nome" required placeholder="Seu nome completo" />
					</div>
					<div class="form__group">
						<label for="cadastroEmail">Email:</label>
						<input type="email" id="cadastroEmail" name="email" required placeholder="seu@email.com" />
					</div>
					<div class="form__group">
						<label for="cadastroTelefone">Telefone:</label>
						<input type="tel" id="cadastroTelefone" name="telefone" placeholder="(XX) XXXXX-XXXX" />
					</div>
					<div class="form__group">
						<label for="cadastroPassword">Senha:</label>
						<input type="password" id="cadastroPassword" name="password" required placeholder="Crie uma senha" />
					</div>
					<div class="form__group">
						<label for="cadastroConfirm">Confirmar Senha:</label>
						<input type="password" id="cadastroConfirm" name="confirm" required placeholder="Confirme sua senha" />
					</div>
					<button type="submit" class="btn btn--primary">Cadastrar</button>
				</form>
				<p class="modal__footer">
					Já tem conta? 
					<button class="link-btn" id="switchToLogin">Faça login aqui</button>
				</p>
			</div>
		</div>

		<div class="modal" id="modalPet">
			<div class="modal__content modal__content--wide">
				<button class="modal__close" id="closePet">&times;</button>
				<h2 class="modal__title">Cadastrar pet</h2>
				<form class="modal__form" id="formPet">
					<p class="form__message" id="petMessage" aria-live="polite"></p>
					<p class="modal__footer modal__footer--left">Usuario conectado: <strong id="petOwnerName">Nenhum usuario conectado</strong></p>
					<div class="form__group">
						<label for="petNome">Nome do pet:</label>
						<input type="text" id="petNome" name="nome" required placeholder="Ex.: Mel" />
					</div>
					<div class="form__group">
						<label for="petIdade">Idade:</label>
						<input type="text" id="petIdade" name="idade" required placeholder="Ex.: 2 anos" />
					</div>
					<div class="form__group">
						<label for="petExames">Exames:</label>
						<input type="text" id="petExames" name="exames" placeholder="Ex.: Hemograma em dia" />
					</div>
					<div class="form__group">
						<label for="petVeterinario">Veterinario responsavel:</label>
						<input type="text" id="petVeterinario" name="veterinario" placeholder="Ex.: Dra. Ana" />
					</div>
					<div class="form__group">
						<label for="petVacinas">Vacinas:</label>
						<input type="text" id="petVacinas" name="vacinas" placeholder="Ex.: V10 e antirrabica em dia" />
					</div>
					<div class="form__group">
						<label for="petImagem">URL da imagem:</label>
						<input type="url" id="petImagem" name="imagem" placeholder="https://exemplo.com/meu-pet.jpg" />
					</div>
					<div class="form__group">
						<label for="petDescricao">Descricao:</label>
						<textarea id="petDescricao" name="descricao" rows="4" placeholder="Conte um pouco sobre seu pet"></textarea>
					</div>
					<button type="submit" class="btn btn--primary">Salvar pet</button>
				</form>
			</div>
		</div>

		<!-- Overlay para fechar modais -->
		<div class="modal__overlay" id="modalOverlay"></div>

		<script src="Script.js"></script>
		<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
		<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
		<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
		<script type="text/babel" data-presets="react" src="ReactMain.js"></script>
	</body>
</html>
